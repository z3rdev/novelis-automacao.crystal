[package]
name = "novelis-cargo-hub"
version = "0.1.0"
description = "Central de CT-es e chamados Novelis"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "novelis_cargo_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
